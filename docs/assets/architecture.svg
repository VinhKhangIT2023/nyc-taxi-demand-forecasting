<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="744" viewBox="0 0 1120 744" role="img" aria-labelledby="title desc">
<title id="title">Kiến trúc NYC Taxi Demand Forecasting</title><desc id="desc">TLC → làm sạch → lưới vùng–giờ → Spark ML → HBase → dashboard. HBase cũng lưu lịch sử và tổng hợp. Nhãn thực tế được đọc riêng khi kiểm chứng.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#0b1220"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#7891b5"/></marker></defs>
<rect width="1120" height="744" rx="24" fill="url(#bg)"/><g font-family="Segoe UI, Arial, sans-serif">
<text x="36" y="48" font-size="27" font-weight="700" fill="#e2e8f0">TỪ CHUYẾN ĐI ĐẾN DỰ BÁO</text>
<text x="36" y="79" font-size="18" font-weight="400" fill="#a8b7cc">36 tháng dữ liệu · xử lý batch · kiểm chứng trên lịch sử năm 2025</text>
<rect x="36" y="114" width="330" height="196" rx="16" fill="#162238" stroke="#2b3d56"/>
<rect x="54" y="132" width="5" height="33" rx="2" fill="#60a5fa" stroke="none"/>
<text x="72" y="149" font-size="14" font-weight="700" fill="#60a5fa">NGUỒN</text>
<text x="56" y="189" font-size="24" font-weight="600" fill="#e2e8f0">NYC TLC · Yellow Taxi</text>
<text x="56" y="221" font-size="18" font-weight="400" fill="#e2e8f0">01/2023 → 12/2025</text>
<text x="56" y="250" font-size="18" font-weight="600" fill="#60a5fa">128.202.548 chuyến nguồn</text>
<text x="56" y="279" font-size="17" font-weight="400" fill="#a8b7cc">Parquet + danh mục 263 vùng</text>
<rect x="395" y="114" width="330" height="196" rx="16" fill="#162238" stroke="#2b3d56"/>
<rect x="413" y="132" width="5" height="33" rx="2" fill="#4ade80" stroke="none"/>
<text x="431" y="149" font-size="14" font-weight="700" fill="#4ade80">XỬ LÝ</text>
<text x="415" y="189" font-size="24" font-weight="600" fill="#e2e8f0">Làm sạch &amp; tổng hợp</text>
<text x="415" y="221" font-size="18" font-weight="400" fill="#e2e8f0">PyArrow + Spark</text>
<text x="415" y="250" font-size="18" font-weight="600" fill="#4ade80">126.994.028 chuyến sạch</text>
<text x="415" y="279" font-size="17" font-weight="400" fill="#a8b7cc">Kiểm tra schema, giờ, vùng, DST</text>
<rect x="754" y="114" width="330" height="196" rx="16" fill="#162238" stroke="#2b3d56"/>
<rect x="772" y="132" width="5" height="33" rx="2" fill="#c4b5fd" stroke="none"/>
<text x="790" y="149" font-size="14" font-weight="700" fill="#c4b5fd">LỊCH SỬ</text>
<text x="774" y="189" font-size="24" font-weight="600" fill="#e2e8f0">Lưới vùng × giờ</text>
<text x="774" y="221" font-size="18" font-weight="400" fill="#e2e8f0">6.917.952 dòng · 263 vùng</text>
<text x="774" y="250" font-size="18" font-weight="600" fill="#c4b5fd">Phân biệt số 0 và giá trị thiếu</text>
<text x="774" y="279" font-size="17" font-weight="400" fill="#a8b7cc">Chuyến chi tiết vẫn giữ ở Parquet</text>
<rect x="754" y="414" width="330" height="218" rx="16" fill="#162238" stroke="#2b3d56"/>
<rect x="772" y="432" width="5" height="33" rx="2" fill="#c4b5fd" stroke="none"/>
<text x="790" y="449" font-size="14" font-weight="700" fill="#c4b5fd">MÔ HÌNH</text>
<text x="774" y="489" font-size="24" font-weight="600" fill="#e2e8f0">Spark ML · Random Forest</text>
<text x="774" y="521" font-size="18" font-weight="400" fill="#e2e8f0">Baseline: cùng giờ tuần trước</text>
<text x="774" y="550" font-size="18" font-weight="600" fill="#c4b5fd">RF: 20 cây · maxDepth 12</text>
<text x="774" y="579" font-size="17" font-weight="400" fill="#e2e8f0">Train 2023–2024 · test 2025</text>
<text x="774" y="608" font-size="17" font-weight="400" fill="#a8b7cc">Đặc trưng chỉ dùng quá khứ</text>
<rect x="395" y="414" width="330" height="218" rx="16" fill="#162238" stroke="#2b3d56"/>
<rect x="413" y="432" width="5" height="33" rx="2" fill="#fbbf24" stroke="none"/>
<text x="431" y="449" font-size="14" font-weight="700" fill="#fbbf24">PHỤC VỤ</text>
<text x="415" y="489" font-size="24" font-weight="600" fill="#e2e8f0">Apache HBase</text>
<text x="415" y="521" font-size="18" font-weight="400" fill="#e2e8f0">Lịch sử · dự báo · tổng hợp</text>
<text x="415" y="550" font-size="18" font-weight="600" fill="#fbbf24">Khóa vùng / thời gian</text>
<text x="415" y="579" font-size="17" font-weight="400" fill="#e2e8f0">Thrift · batch put · scan giới hạn</text>
<text x="415" y="608" font-size="17" font-weight="400" fill="#a8b7cc">Lưu bền trong Docker volume</text>
<rect x="36" y="414" width="330" height="218" rx="16" fill="#162238" stroke="#2b3d56"/>
<rect x="54" y="432" width="5" height="33" rx="2" fill="#60a5fa" stroke="none"/>
<text x="72" y="449" font-size="14" font-weight="700" fill="#60a5fa">GIAO DIỆN</text>
<text x="56" y="489" font-size="24" font-weight="600" fill="#e2e8f0">Streamlit · Plotly</text>
<text x="56" y="521" font-size="18" font-weight="400" fill="#e2e8f0">5 trang · Light / Dark</text>
<text x="56" y="550" font-size="18" font-weight="600" fill="#60a5fa">Dự báo 1 giờ + số thực tế</text>
<text x="56" y="579" font-size="17" font-weight="400" fill="#e2e8f0">Bản đồ · bộ lọc · xuất CSV</text>
<text x="56" y="608" font-size="17" font-weight="400" fill="#a8b7cc">Phát lại lịch sử · không trực tiếp</text>
<path d="M366 210 H391" fill="none" stroke="#7891b5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M725 210 H750" fill="none" stroke="#7891b5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M919 310 V410" fill="none" stroke="#7891b5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M810 310 V345 H560 V410" fill="none" stroke="#7891b5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M754 526 H729" fill="none" stroke="#7891b5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M395 526 H370" fill="none" stroke="#7891b5" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="935" y="373" font-size="15" font-weight="400" fill="#a8b7cc">đặc trưng</text>
<text x="582" y="336" font-size="15" font-weight="400" fill="#a8b7cc">lịch sử + tổng hợp</text>
<path d="M36 664 H1084" fill="none" stroke="#3b506e" stroke-width="2.5" stroke-linejoin="round"/>
<text x="36" y="695" font-size="14" font-weight="700" fill="#4ade80">BATCH</text>
<text x="105" y="695" font-size="17" font-weight="400" fill="#a8b7cc">Dự báo tính sẵn; chọn giờ trên Web không huấn luyện lại.</text>
<text x="36" y="724" font-size="14" font-weight="700" fill="#60a5fa">KIỂM CHỨNG</text>
<text x="150" y="724" font-size="17" font-weight="400" fill="#a8b7cc">Đọc nhãn thực tế riêng, không đưa nhãn tương lai vào đặc trưng.</text>
</g></svg>
