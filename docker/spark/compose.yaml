name: bigdata-spark-trial
services:
  spark:
    image: bigdata-spark:3.5.7-py311
    platform: linux/amd64
    build:
      context: ../..
      dockerfile: docker/spark/Dockerfile
    cpus: 2.0
    mem_limit: 4g
    memswap_limit: 4g
    init: true
    environment:
      PYTHONPATH: /workspace
      HBASE_HOST: host.docker.internal
    volumes:
      - ../../src:/workspace/src:ro
      - ../../data:/workspace/data:ro
      - ../../artifacts/metrics:/workspace/artifacts/metrics
      - ../../data/processed/spark_trial_2024-01_v1:/output
